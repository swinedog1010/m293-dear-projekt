<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | D.E.A.R.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="../../d.e.a.r_logo.png" />
  <link rel="stylesheet" href="../../style.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="bg-shapes">
    <div class="blob blob-1" aria-hidden="true"></div>
    <div class="blob blob-2" aria-hidden="true"></div>
    <div class="blob blob-3" aria-hidden="true"></div>
  </div>
  <div class="hero-grid-overlay" aria-hidden="true"></div>

  <header class="site-header glass">
    <div class="header-inner container">
      <a href="../../index.html" class="logo-link">
        <img src="../../d.e.a.r_logo.png" alt="D.E.A.R. Logo" class="logo-img" />
      </a>
      <a href="../../index.html" class="btn btn-ghost btn-sm">Zurück zur Startseite</a>
    </div>
  </header>

  <main class="auth-page-wrapper">
    <div class="auth-card fade-up">
      <div class="auth-form-box">
        <div class="auth-icon">👋</div>
        <h3>Willkommen zurück</h3>
        <p>Melde dich an und entdecke deine Merkliste.</p>
        <form id="login-form">
          <div class="input-group">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
            <input type="email" id="log-email" placeholder="deine@email.ch" required />
          </div>
          <div class="input-group">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="log-password" placeholder="Passwort" required />
          </div>
          <button type="submit" class="btn btn-primary btn-auth">Einloggen</button>
        </form>
        <p class="auth-switch">Noch keinen Account? <a href="signup.html">Jetzt erstellen</a></p>
      </div>
    </div>
  </main>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <script src="script.js"></script>
</body>
</html>
